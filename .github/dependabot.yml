# Dependabot 版本更新（C3）：自动保持 GitHub Actions 锁定的 SHA 升级到新版本。
# 与 SHA pinning 配合：commit SHA 提供即时供应链保护，Dependabot 负责持续更新。
# 方法论：GitHub Docs《Security hardening for GitHub Actions》→ Keeping your actions up to date with Dependabot。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
