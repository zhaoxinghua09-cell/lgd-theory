# C3 · Dependabot 配置
# 与组织级 "selected actions + SHA pinning" 策略对齐：自动提交 PR 更新 GitHub Actions
# 版本；人工复核变更后，再把 uses 改写为全量 commit SHA（保持 C2 锁 SHA 纪律，
# 避免依赖可变 tag 被劫持）。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # 仅扫描 .github/workflows，避免误伤仓库内其它子项目
    allow:
      - dependency-type: "direct"
