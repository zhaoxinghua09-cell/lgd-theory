name: lgd-ci-gate

# 发布闸门 · 服务端校验
# 作用：PR 或推送到 main 时，校验 docs/ 下的理论件是否带合法审查标记。
# 注意：本工作流只**报警**；要真正拦合并，须在仓库设置里启用分支保护并要求本检查通过。
# P1-2: workflow name 与分支保护 required status check 对齐为 lgd-ci-gate。
# 规范见 11-研究成果/发布闸门/发布闸门规范_v1.md（本地）

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/check_review_status.py'
      - '.review-gate-baseline'
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lgd-ci-gate:
    name: lgd-ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Run publish review gate
        run: |
          if [ -f .review-gate-baseline ]; then
            python tools/check_review_status.py docs --baseline .review-gate-baseline
          else
            echo "::warning::未找到基线文件，按严格模式执行"
            python tools/check_review_status.py docs
          fi
